name: Vigilancia directa de fuentes y fichas verificadas
on:
  schedule:
    - cron: '40 1,7,13,19 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: vigilancia-encuestas-main
  cancel-in-progress: false
jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar directamente medios y productores
        run: |
          python scripts/vigilar_encuestas.py monitor-output
          python scripts/vigilar_microdatos.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Incorporar únicamente fichas contrastadas y comprobar
        id: incorporate
        run: |
          python scripts/incorporar_encuestas.py --report monitor-output
          python -m unittest discover -s tests -p 'test_*.py' -v
          node scripts/export-csv.mjs
          npm test
      - name: Distinguir incorporación de una simple búsqueda
        id: publish
        run: |
          if git diff --quiet -- data/polls.json; then
            echo 'updated=false' >> "$GITHUB_OUTPUT"
          else
            echo 'updated=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Registrar y guardar el informe versionado
        run: |
          python scripts/estado_actualizacion.py monitor-output \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --recalculo-lanzado false
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vigilancia data/ingesta/estado.json data/polls.json data/polls.csv data/poll-results.csv
          git diff --cached --quiet || git commit -m "Vigilancia: fuentes directas y fichas verificadas"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Recalcular y publicar solo tras incorporar encuestas
        if: success() && steps.publish.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vigilancia-documental
          path: monitor-output/
      - name: Señalar fallo total sin ocultar las fichas incorporadas
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/vigilancia/candidatos.json'))
          if d['status']=='failed':raise SystemExit('Todas las fuentes fallaron; se conserva la búsqueda anterior.')
          PY

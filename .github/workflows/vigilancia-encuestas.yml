name: Vigilancia documental de encuestas
on:
  schedule:
    - cron: '40 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descubrir noticias y fuentes candidatas
        run: python scripts/vigilar_encuestas.py monitor-output
      - uses: actions/upload-artifact@v4
        with:
          name: vigilancia-documental
          path: monitor-output/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Incorporar fichas verificadas, sin duplicados
        run: |
          python scripts/incorporar_encuestas.py --report monitor-output
          python -m unittest discover -s tests -p 'test_incorporar_encuestas.py' -v
          node scripts/export-csv.mjs
          npm test
      - name: Publicar datos incorporados (si hay cambios)
        id: publish
        run: |
          git add data/polls.json data/polls.csv data/poll-results.csv
          if git diff --cached --quiet; then
            echo 'updated=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Datos: incorporar encuestas verificadas y actualizar CSV"
            git push origin HEAD:main
            echo 'updated=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Recalcular y publicar Motor 29N tras incorporar encuestas
        if: steps.publish.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
      - name: Crear o actualizar cola de revisión en Issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("monitor-output/report.md")
          note="\n\n**Control editorial obligatorio:** corroborar fuente original, fecha de campo y de publicación, muestra, variable objetivo, categorías y escenario. No se realiza incorporación automática al promedio o al Motor 29N."
          p.write_text(p.read_text(encoding="utf-8")+note+"\n",encoding="utf-8")
          PY
          TITLE="[Vigilancia] Encuestas y análisis pendientes de revisión"
          EXISTING=$(gh issue list --state open --search "in:title [Vigilancia] Encuestas y análisis pendientes de revisión" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file monitor-output/report.md
          else
            gh issue create --title "$TITLE" --body-file monitor-output/report.md
          fi

name: Inspección de fuente oficial europea 2024
on:
  push:
    paths:
      - scripts/inspeccionar_europeas_2024.py
      - .github/workflows/inspeccionar-europeas.yml
permissions:
  contents: read
jobs:
  inspeccionar:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/inspeccionar_europeas_2024.py

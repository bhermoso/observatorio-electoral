name: Motor de pronóstico (Python)
on:
  # Pages ya ejecuta estas pruebas en main; evitar comprobación doble en cada push.
  pull_request:
    paths:
      - 'modelo/**'
      - 'requirements-ciencia.txt'
      - 'scripts/validar_multieleccion.py'
      - 'scripts/importar_historico_multieleccion.py'
      - 'data/**'
      # Los agregados de microdatos se verifican en la revisión rápida JS;
      # no intervienen en el cálculo Python del Motor 29N.
      - '!data/microdatos/**'
      - '.github/workflows/modelo.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-ciencia.txt
      - run: python -m unittest discover -s modelo/tests -t .
      - run: python scripts/validar_multieleccion.py
      - run: python -m modelo --n 500

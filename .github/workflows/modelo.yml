name: Motor de pronóstico (Python)
on:
  push:
    paths: ['modelo/**', 'data/**', '.github/workflows/modelo.yml']
  pull_request:
    paths: ['modelo/**', 'data/**', '.github/workflows/modelo.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - run: python -m unittest discover -s modelo/tests -t .
      - run: python -m modelo --n 500

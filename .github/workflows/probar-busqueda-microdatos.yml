name: Comprobar vigilancia directa de microdatos
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/vigilar_microdatos.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidatos-documentales-microdatos
          path: data/vigilancia/microdatos.json

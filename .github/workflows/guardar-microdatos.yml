name: Comprobar certificados públicos de custodia privada
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/microdatos/custodia.json'
      - 'data/microdatos/custodia-manifiesto.json'
permissions:
  contents: read
jobs:
  certificates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contrastar certificados sin acceder a entrevistas
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/microdatos/custodia.json'))
          m=json.load(open('data/microdatos/custodia-manifiesto.json'))
          assert d['provider']=='github_private'
          assert d['repository']=='bhermoso/observatorio-electoral-custodia'
          rows={x['study_id']:x for x in d['stored']}
          for x in m['files']:
            assert rows[x['study_id']]['sha256']==x['sha256']
            assert rows[x['study_id']]['bytes']==x['bytes']
          print('Cuatro certificados contrastados. La recuperación real se verifica en el repositorio privado.')
          PY

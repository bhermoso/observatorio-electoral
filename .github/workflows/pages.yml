name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Publicación diaria: actualiza el pronóstico y aplica la veda electoral a su hora
  # (23:05 UTC = 00:05 en Madrid), aunque ese día no haya cambios en main.
  schedule:
    - cron: '5 23 * * *'
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      # Regenera el pronóstico con las encuestas de main y la fecha del día antes de publicar.
      - run: python -m modelo --n 1500
      - run: python scripts/procesar_microdatos.py
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

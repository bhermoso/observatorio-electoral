name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
    # Un cambio solo en el registro de vigilancia o en CSV derivados
    # no requiere un recálculo: la publicación programada se mantiene.
    paths-ignore:
      - 'data/ingesta/estado.json'
      - 'data/vigilancia/**'
      - 'data/polls.csv'
      - 'data/poll-results.csv'
  workflow_dispatch:
  # Se ejecuta solo en main, manualmente o cada día. Los PR usan comprobaciones ligeras.
  # Publicación diaria: actualiza el pronóstico y aplica la veda electoral a su hora
  # (23:05 UTC = 00:05 en Madrid), aunque ese día no haya cambios en main.
  schedule:
    - cron: '5 23 * * *'
permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: true
env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/export-csv.mjs
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-ciencia.txt
      # Todas las pruebas Python de scripts (detecta, p. ej., errores de sintaxis en la incorporación).
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m unittest discover -s modelo/tests -t . -v
      - name: Regenerar evidencia científica nacional (sin red)
        run: python scripts/validar_multieleccion.py
      # La puerta rápida solo se abre ante cambios editoriales o de Cocina.
      # Reutiliza exclusivamente el pronóstico YA PUBLICADO cuando los hashes
      # de encuestas coinciden y su corte tiene como máximo dos días.
      # En schedule/manual o ante cualquier duda se recalcula siempre.
      - name: Comprobar si se puede publicar sin recalcular el motor
        id: plan
        run: node scripts/plan-publicacion.mjs
      - name: Recalcular Motor 29N cuando proceda
        if: steps.plan.outputs.reuse_model != 'true'
        run: python -m modelo --n 1500
      - run: python scripts/procesar_microdatos.py
      - run: npm run build
        env:
          REUTILIZAR_MODELO: ${{ steps.plan.outputs.reuse_model }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    # Ninguna ejecución manual en una rama de trabajo puede publicar producción.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Comprobar que la versión publicada coincide con este commit
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # GitHub Pages puede tardar en servir el artefacto nuevo.
          # No tomar un despliegue aceptado como prueba de versión publicada.
          for intento in $(seq 1 18); do
            curl --fail --silent --show-error --location --max-time 15 \
              "${PAGES_URL%/}/version-publica.json?verificacion=${EXPECTED_SHA}" \
              -o version-publica.json || true
            if [ -s version-publica.json ] && \
               node -e 'const f=require("./version-publica.json");process.exit(f.commit===process.env.EXPECTED_SHA?0:1)'; then
              echo "Despliegue verificado: ${EXPECTED_SHA}"
              exit 0
            fi
            echo "Intento ${intento}: Pages todavía no sirve el commit esperado"
            sleep 10
          done
          echo "::error::Pages no muestra el commit ${EXPECTED_SHA} después de comprobar la URL pública"
          exit 1

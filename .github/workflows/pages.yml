name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
    # Un cambio solo en el registro de vigilancia o en CSV derivados
    # no requiere un recálculo: la publicación programada se mantiene.
    paths-ignore:
      - 'data/ingesta/estado.json'
      - 'data/vigilancia/**'
      - 'data/polls.csv'
      - 'data/poll-results.csv'
  workflow_dispatch:
  # Se ejecuta solo en main, manualmente o cada día. Los PR usan comprobaciones ligeras.
  # Publicación diaria: actualiza el pronóstico y aplica la veda electoral a su hora
  # (23:05 UTC = 00:05 en Madrid), aunque ese día no haya cambios en main.
  schedule:
    - cron: '5 23 * * *'
permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/export-csv.mjs
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      # Todas las pruebas Python de scripts (detecta, p. ej., errores de sintaxis en la incorporación).
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m unittest discover -s modelo/tests -t . -v
      # Regenera el pronóstico con las encuestas de main y la fecha del día antes de publicar.
      - run: python -m modelo --n 1500
      - run: python scripts/procesar_microdatos.py
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    # Ninguna ejecución manual en una rama de trabajo puede publicar producción.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

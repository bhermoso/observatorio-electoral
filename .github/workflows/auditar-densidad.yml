name: Auditoría visual comparador y densidad
on:
  pull_request:
    paths:
      - styles.css
      - home-impact.mjs
      - analysis.mjs
      - promedios-comparador.mjs
      - events.mjs
      - eventos-visual.mjs
      - scripts/auditar-densidad.mjs
      - .github/workflows/auditar-densidad.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/auditar-densidad.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-densidad
          path: auditoria-densidad/

name: Auditoría visual comparador y densidad
on:
  # La auditoría gráfica completa se activa manualmente al cerrar una revisión,
  # no en cada intento de ajustar el CSS o los gráficos.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/auditar-densidad.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-densidad
          path: auditoria-densidad/

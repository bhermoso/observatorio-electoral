name: Auditar fuentes privadas de microdatos (sin publicar entrevistas)
on:
  push:
    branches: [main]
    paths:
      - "scripts/auditar_fuentes_privadas.py"
      - ".github/workflows/auditoria-privados.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias para inspección de SPSS (sin subir matrices)
        run: python -m pip install --disable-pip-version-check pyreadstat==1.3.2
      - name: Validar sintaxis y manifest sin descargar filas a GitHub
        run: python -m py_compile scripts/auditar_fuentes_privadas.py
      - name: Descargar e inspeccionar estructura de originales
        run: python scripts/auditar_fuentes_privadas.py

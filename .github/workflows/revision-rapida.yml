name: Revisión rápida de cambios
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: revision-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar código e integración sin recalcular el pronóstico
        run: npm test

  interiores:
    # Playwright 1.56.1 supports Ubuntu 24.04; avoid a moving runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Navegación, responsive, teclado y accesibilidad
        run: |
          npm run dev > /tmp/observatorio-server.log 2>&1 &
          npm run test:browser
          node scripts/auditar-comparador.mjs
          node scripts/auditar-encuestas-resultados.mjs
          node scripts/auditar-misma-muestra.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auditoria-interiores
          path: work/auditoria-interiores/
  vigilancia-directa:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-ciencia.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Probar las fuentes desde GitHub sin publicar ni incorporar
        run: |
          python scripts/vigilar_encuestas.py work/vigilancia
          python scripts/vigilar_microdatos.py
          python - <<'PY'
          import json
          a=json.load(open('data/vigilancia/candidatos.json'))
          b=json.load(open('data/vigilancia/microdatos.json'))
          assert a['sources_ok']>0,'Todas las fuentes de encuestas fallaron'
          assert b['summary']['paginas_accesibles']>0,'Todas las páginas de microdatos fallaron'
          print('Cobertura de encuestas:',a['sources_ok'],'de',a['searches'])
          print('Cobertura de microdatos:',b['summary'])
          PY
          git diff --exit-code -- data/polls.json modelo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-vigilancia-directa
          path: |
            work/vigilancia/
            data/vigilancia/microdatos.json

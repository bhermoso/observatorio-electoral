name: Revisión rápida de cambios
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: revision-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar código e integración sin recalcular el pronóstico
        run: npm test
